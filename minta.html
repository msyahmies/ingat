<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Senarai Barang</title>
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="icon-192.png">
<style>
  :root{--bg:#f5f5f4;--card:#fff;--ink:#1c1917;--mute:#78716c;--line:#e7e5e4;--brand:#0f766e;--brand-ink:#fff;--soft:#ccfbf1;--red:#dc2626;--red-soft:#fee2e2}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){--bg:#0c0a09;--card:#1c1917;--ink:#f5f5f4;--mute:#a8a29e;--line:#292524;--brand:#14b8a6;--brand-ink:#042f2e;--soft:#134e4a;--red:#f87171;--red-soft:#450a0a}
  }
  :root[data-theme="dark"]{--bg:#0c0a09;--card:#1c1917;--ink:#f5f5f4;--mute:#a8a29e;--line:#292524;--brand:#14b8a6;--brand-ink:#042f2e;--soft:#134e4a;--red:#f87171;--red-soft:#450a0a}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{background:var(--brand);color:var(--brand-ink);padding:calc(16px + env(safe-area-inset-top)) 16px 18px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:560px;margin:0 auto}
  header h1{margin:0;font-size:21px}
  header p{margin:4px auto 0;max-width:560px;opacity:.9;font-size:14px}
  .lang{font:700 14px system-ui;color:inherit;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);border-radius:20px;padding:6px 12px}
  main{max-width:560px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
  label:first-child{margin-top:0}
  .hint{font-weight:400;color:var(--mute);font-size:13px}
  input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
  textarea{min-height:150px;resize:vertical}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{font:500 14px system-ui;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:20px;padding:7px 12px}
  .btn{width:100%;margin-top:18px;font:700 16px system-ui;border:0;border-radius:12px;padding:14px;background:var(--brand);color:var(--brand-ink)}
  .btn:disabled{opacity:.6}
  .btn.ghost{background:var(--soft);color:var(--ink)}
  .err{background:var(--red-soft);color:var(--red);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:14px}
  .done{text-align:center;padding:30px 16px}
  .done b{display:block;font-size:52px}
  .done h2{margin:6px 0}
  .done p{color:var(--mute);margin:0}
  .hp{position:absolute;left:-9999px}
  .hidden{display:none!important}
</style>
</head>
<body>
<header>
  <div class="top"><h1 data-t="h1">🛒 Senarai Barang Nak Beli</h1><button type="button" class="lang" id="langBtn">EN</button></div>
  <p data-t="sub">Tulis barang yang perlu dibeli. Ia akan terus masuk ke dalam senarai di fon dia.</p>
</header>
<main>
  <div class="card err hidden" id="noLink" data-t="noLink">Link ni tak lengkap. Minta link baru dari orang yang hantar.</div>

  <form class="card" id="form" autocomplete="off">
    <label for="from" data-t="fromL">Nama kau</label>
    <input id="from" maxlength="60" data-tp="fromPh" placeholder="cth: Sayang / Mak">

    <label for="items"><span data-t="itemsL">Barang nak beli</span> <span class="hint" data-t="itemsHint">(satu baris satu barang)</span></label>
    <textarea id="items" required data-tp="itemsPh" placeholder="Telur 1 papan&#10;Beras 10kg&#10;Bawang merah"></textarea>
    <div class="chips" id="chips"></div>

    <label for="note"><span data-t="noteL">Nota</span> <span class="hint" data-t="opt">(pilihan)</span></label>
    <input id="note" maxlength="300" data-tp="notePh" placeholder="cth: Beli sebelum Maghrib">
    <input class="hp" id="website" tabindex="-1" aria-hidden="true">

    <div class="err hidden" id="err"></div>
    <button class="btn" id="send" data-t="send">Hantar senarai</button>
  </form>

  <div class="card done hidden" id="ok">
    <b>✅</b>
    <h2 data-t="okH">Dah hantar!</h2>
    <p id="okP"></p>
    <button class="btn ghost" id="again" data-t="again">Hantar lagi</button>
  </div>
</main>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const L = {
    ms: { h1: '🛒 Senarai Barang Nak Beli', sub: 'Tulis barang yang perlu dibeli. Ia akan terus masuk ke dalam senarai di fon dia.',
      noLink: 'Link ni tak lengkap. Minta link baru dari orang yang hantar.', fromL: 'Nama kau', fromPh: 'cth: Sayang / Mak',
      itemsL: 'Barang nak beli', itemsHint: '(satu baris satu barang)', itemsPh: 'Telur 1 papan\nBeras 10kg\nBawang merah',
      noteL: 'Nota', opt: '(pilihan)', notePh: 'cth: Beli sebelum Maghrib', send: 'Hantar senarai', sending: 'Menghantar…',
      okH: 'Dah hantar!', okP: (n) => `${n} barang dah masuk ke senarai dia.`, again: 'Hantar lagi',
      empty: 'Tulis sekurang-kurangnya satu barang.', fail: 'Gagal hantar. Semak internet dan cuba lagi.',
      chips: ['Telur', 'Beras', 'Gula', 'Minyak masak', 'Susu', 'Roti', 'Bawang merah', 'Bawang putih', 'Sayur', 'Ayam', 'Ikan', 'Sabun basuh', 'Tisu'] },
    en: { h1: '🛒 Shopping List', sub: "Write what needs to be bought. It goes straight into the list on their phone.",
      noLink: 'This link is incomplete. Ask the sender for a new link.', fromL: 'Your name', fromPh: 'e.g. Honey / Mum',
      itemsL: 'Items to buy', itemsHint: '(one item per line)', itemsPh: 'Eggs, 1 tray\nRice 10kg\nShallots',
      noteL: 'Note', opt: '(optional)', notePh: 'e.g. Buy before evening', send: 'Send list', sending: 'Sending…',
      okH: 'Sent!', okP: (n) => `${n} item(s) added to their list.`, again: 'Send another',
      empty: 'Write at least one item.', fail: 'Could not send. Check your internet and try again.',
      chips: ['Eggs', 'Rice', 'Sugar', 'Cooking oil', 'Milk', 'Bread', 'Shallots', 'Garlic', 'Vegetables', 'Chicken', 'Fish', 'Detergent', 'Tissue'] }
  };
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
  let lang = store.get('minta-lang') || (/^(ms|id)/i.test(navigator.language || '') ? 'ms' : 'en');
  const t = (k) => L[lang][k];

  function apply() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
    document.querySelectorAll('[data-tp]').forEach((el) => { el.placeholder = t(el.dataset.tp); });
    $('#langBtn').textContent = lang === 'ms' ? 'EN' : 'BM';
    $('#chips').innerHTML = t('chips').map((c) => `<button type="button" class="chip">+ ${c}</button>`).join('');
  }
  $('#langBtn').addEventListener('click', () => { lang = lang === 'ms' ? 'en' : 'ms'; store.set('minta-lang', lang); apply(); });
  $('#chips').addEventListener('click', (e) => {
    const b = e.target.closest('.chip'); if (!b) return;
    const ta = $('#items'), v = b.textContent.replace(/^\+ /, '');
    ta.value = (ta.value.trim() ? ta.value.replace(/\s*$/, '') + '\n' : '') + v;
    b.disabled = true; b.style.opacity = .45;
  });

  // URL skrip dihantar dalam hash (#u=...) supaya tak perlu ubah kod
  const url = new URLSearchParams(location.hash.slice(1)).get('u');
  if (!url || !/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) {
    $('#noLink').classList.remove('hidden'); $('#form').classList.add('hidden');
  }
  $('#from').value = store.get('minta-from') || '';

  $('#form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = $('#err'); err.classList.add('hidden');
    const items = $('#items').value.split(/[\n,]+/).map((s) => s.trim()).filter(Boolean);
    if (!items.length) { err.textContent = t('empty'); err.classList.remove('hidden'); return; }
    const btn = $('#send'); btn.disabled = true; btn.textContent = t('sending');
    store.set('minta-from', $('#from').value.trim());
    const body = new URLSearchParams({ from: $('#from').value.trim(), items: items.join('\n'), note: $('#note').value.trim(), website: $('#website').value });
    try {
      const res = await fetch(url, { method: 'POST', body });
      const j = await res.json();
      if (j.result !== 'success') throw new Error(j.message);
      $('#okP').textContent = t('okP')(j.count || items.length);
      $('#form').classList.add('hidden'); $('#ok').classList.remove('hidden');
    } catch (x) {
      err.textContent = t('fail'); err.classList.remove('hidden');
    } finally { btn.disabled = false; btn.textContent = t('send'); }
  });
  $('#again').addEventListener('click', () => {
    $('#items').value = ''; $('#note').value = ''; apply();
    $('#ok').classList.add('hidden'); $('#form').classList.remove('hidden'); $('#items').focus();
  });
  apply();
})();
</script>
</body>
</html>
